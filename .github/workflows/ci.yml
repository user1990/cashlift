name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Lint, types, tests, security, application and docs builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts
        env:
          NODE_ENV: development

      - name: Install Playwright browsers
        run: pnpm run test:e2e:install

      - name: Lint
        run: pnpm exec biome check .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests and coverage thresholds
        run: pnpm test

      - name: Performance budget
        run: pnpm run check:performance

      - name: Security check
        run: pnpm run security:check

      - name: Dependency audit
        run: pnpm run security:audit

      - name: Code quality
        run: pnpm run check:code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Production build
        run: mkdir -p .next/cache && pnpm build

      - name: Documentation build
        run: pnpm docs:build

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
