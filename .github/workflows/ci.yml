name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Lint, types, unit tests, security, code quality, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts
        env:
          NODE_ENV: development

      - name: Lint
        run: npx biome check .

      - name: Type check
        run: pnpm exec tsgo --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Security check
        run: pnpm run security:check

      - name: Dependency audit
        run: pnpm run security:audit

      - name: Code quality
        run: pnpm run check:code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Production build
        run: pnpm build
