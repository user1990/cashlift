minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security exception: required to remediate GHSA-v2hh-gcrm-f6hx before its one-week age gate.
  - fast-uri@3.1.4
  # Security exceptions: required to remediate GHSA-r28c-9q8g-f849 and GHSA-mh99-v99m-4gvg before their one-week age gate.
  - postcss@8.5.18
  - brace-expansion@5.0.8
overrides:
  '@vercel/routing-utils>path-to-regexp': 6.3.0
  fast-uri: 3.1.4
  postcss: 8.5.18
  brace-expansion@5.0.7: 5.0.8
  sharp: 0.35.0
  undici: 7.28.0
  valibot: 1.4.1
peerDependencyRules:
  allowedVersions:
    typescript: 6.0.2
    '@scalar/astro>astro': 7.0.7
    '@tailwindcss/typography>tailwindcss': 4.3.2
allowBuilds:
  '@clerk/shared': false
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  esbuild: true
  fallow: true
  lefthook: true
  msw: false
  sharp: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
