minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security exceptions: required to remediate GHSA-7p8r-x3mc-p8w7 before the one-week age gate.
  - fast-uri@3.1.5
  # Security exceptions: required to remediate GHSA-rgw5-rvv9-x895 before the one-week age gate.
  - brace-expansion@5.0.9
overrides:
  '@vercel/routing-utils>path-to-regexp': 6.3.0
  fast-uri: 3.1.5
  postcss: 8.5.23
  brace-expansion@5.0.7: 5.0.9
  sharp: 0.35.0
  undici: 7.28.0
  valibot: 1.4.2
peerDependencyRules:
  allowedVersions:
    typescript: 6.0.2
    '@scalar/astro>astro': 7.0.7
    '@tailwindcss/typography>tailwindcss': 4.3.2
allowBuilds:
  '@clerk/shared': false
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  esbuild: true
  fallow: true
  lefthook: true
  msw: false
  sharp: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
